<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 812" font-family="Inter, sans-serif">
<defs>
<marker id="l-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00f0ff"/></marker>
<marker id="l-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00ff88"/></marker>
<marker id="l-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8c00"/></marker>
<marker id="l-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
<marker id="l-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff4466"/></marker>
<marker id="l-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a85"/></marker>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>

<rect width="1200" height="812" fill="#0a0a0f"/>
<text x="600" y="40" text-anchor="middle" font-size="22" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">HITL 学习闭环：分身如何越用越像你</text>
<text x="600" y="64" text-anchor="middle" font-size="13" fill="#7a7a85" font-family="Inter, sans-serif">纠正即语料 · 攒 10 项复盘 · 确认才入库 · 3 个月未引用淘汰</text>

<!-- ═══ 上方：日常使用（分身侧）═══ -->
<rect x="36" y="88" width="540" height="256" rx="12" fill="#12121a" fill-opacity="0.55" stroke="#2a2a35" stroke-width="1.2"/>
<text x="56" y="118" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">日常使用（分身侧）</text>
<text x="556" y="118" text-anchor="end" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">每次任务 · 用户只做 review</text>

<rect x="56" y="132" width="500" height="52" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#2a2a35" stroke-width="1.2"/>
<rect x="60" y="132" width="3" height="52" rx="1.5" fill="#00f0ff"/>
<text x="74" y="154" text-anchor="start" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">画像定位 + 按需路由</text>
<text x="74" y="172" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">5 级定位找到画像库 → 任务类型决定加载哪几层（≤3 层）</text>

<line x1="306" y1="184" x2="306" y2="200" stroke="#2a2a35" stroke-width="1.6" marker-end="url(#l-gray)"/>

<rect x="56" y="208" width="500" height="52" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#2a2a35" stroke-width="1.2"/>
<rect x="60" y="208" width="3" height="52" rx="1.5" fill="#00f0ff"/>
<text x="74" y="230" text-anchor="start" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">分级决策 + 留痕产出</text>
<text x="74" y="248" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">L1 自主执行留痕 / L2 列选项请示 / L3 强制确认后执行</text>

<line x1="306" y1="260" x2="306" y2="276" stroke="#2a2a35" stroke-width="1.6" marker-end="url(#l-gray)"/>

<rect x="56" y="284" width="500" height="52" rx="8" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="1.4"/>
<rect x="60" y="284" width="3" height="52" rx="1.5" fill="#00ff88"/>
<text x="74" y="306" text-anchor="start" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">用户简单 review</text>
<text x="74" y="324" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">把控大方向；发现不对直接说——「纠正」就是学习信号</text>

<!-- 纠正箭头：从「用户简单 review」竖直注入「识别纠正类型」 -->
<line x1="164" y1="336" x2="164" y2="426" stroke="#ff8c00" stroke-width="2.4" marker-end="url(#l-orange)"/>
<g filter="url(#soft)">
<rect x="196" y="358" width="212" height="34" rx="17" fill="#ff8c00" fill-opacity="0.12" stroke="#ff8c00" stroke-width="1.2"/>
</g>
<text x="302" y="380" text-anchor="middle" font-size="12" fill="#ff8c00" font-family="Inter, sans-serif" font-weight="700">纠 正</text>
<text x="96" y="366" text-anchor="end" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">说清哪里错、应该怎样</text>
<text x="96" y="381" text-anchor="end" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">当前任务同步修正</text>

<!-- ═══ 下方：进化闭环 ═══ -->
<rect x="36" y="430" width="1128" height="232" rx="12" fill="#12121a" fill-opacity="0.55" stroke="#2a2a35" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="56" y="458" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">进化闭环（每攒 10 项语料走一轮）</text>
<text x="1144" y="458" text-anchor="end" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">全流程约 10 分钟 · 用户只参与确认</text>

<!-- 识别纠正类型 -->
<rect x="66" y="474" width="192" height="144" rx="10" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<rect x="70" y="474" width="184" height="3" rx="1.5" fill="#00f0ff"/>
<text x="162" y="502" text-anchor="middle" font-size="13.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">识别纠正类型</text>
<text x="162" y="528" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">编码习惯 / 架构偏好</text>
<text x="162" y="546" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">工作方法 / 决策原则 / 新知识</text>
<text x="162" y="574" text-anchor="middle" font-size="9.5" fill="#00f0ff" font-family="JetBrains Mono, monospace">任务上下文补充不算纠正</text>
<text x="162" y="596" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">分身自动执行，用户零操作</text>

<line x1="258" y1="546" x2="288" y2="546" stroke="#00f0ff" stroke-width="2" marker-end="url(#l-cyan)"/>

<!-- 语料追加 -->
<rect x="296" y="474" width="192" height="144" rx="10" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.3"/>
<rect x="300" y="474" width="184" height="3" rx="1.5" fill="#00ff88"/>
<text x="392" y="502" text-anchor="middle" font-size="13.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">语料追加</text>
<text x="392" y="528" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">写入 corpus/raw-corpus.md</text>
<text x="392" y="546" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">待复盘区累积</text>
<text x="392" y="574" text-anchor="middle" font-size="9.5" fill="#00ff88" font-family="JetBrains Mono, monospace">≥10 项主动提醒复盘</text>
<text x="392" y="596" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">积压 &gt;20 项强制预警</text>

<line x1="488" y1="546" x2="518" y2="546" stroke="#00ff88" stroke-width="2" marker-end="url(#l-green)"/>

<!-- AI 预生成总结 -->
<rect x="526" y="474" width="192" height="144" rx="10" fill="#a855f7" fill-opacity="0.05" stroke="#a855f7" stroke-width="1.3"/>
<rect x="530" y="474" width="184" height="3" rx="1.5" fill="#a855f7"/>
<text x="622" y="502" text-anchor="middle" font-size="13.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">AI 预生成总结</text>
<text x="622" y="528" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">按画像层分组</text>
<text x="622" y="546" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">候选条目可执行化</text>
<text x="622" y="574" text-anchor="middle" font-size="9.5" fill="#a855f7" font-family="JetBrains Mono, monospace">冲突标注合并建议</text>
<text x="622" y="596" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">用户不用自己整理</text>

<line x1="718" y1="546" x2="748" y2="546" stroke="#a855f7" stroke-width="2" marker-end="url(#l-purple)"/>

<!-- 用户逐条确认 -->
<rect x="756" y="474" width="192" height="144" rx="10" fill="#ff4466" fill-opacity="0.05" stroke="#ff4466" stroke-width="1.5"/>
<rect x="760" y="474" width="184" height="3" rx="1.5" fill="#ff4466"/>
<text x="852" y="502" text-anchor="middle" font-size="13.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">用户逐条确认</text>
<text x="852" y="528" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">采纳 / 修改后采纳 / 放弃</text>
<text x="852" y="546" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">分批勾选，每批 ≤4 条</text>
<text x="852" y="574" text-anchor="middle" font-size="9.5" fill="#ff4466" font-family="JetBrains Mono, monospace">HITL 确认门</text>
<text x="852" y="596" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">用户始终掌控进化</text>

<line x1="948" y1="546" x2="978" y2="546" stroke="#ff4466" stroke-width="2" marker-end="url(#l-red)"/>

<!-- 入库归档 -->
<rect x="986" y="474" width="160" height="144" rx="10" fill="#ff8c00" fill-opacity="0.05" stroke="#ff8c00" stroke-width="1.3"/>
<rect x="990" y="474" width="152" height="3" rx="1.5" fill="#ff8c00"/>
<text x="1066" y="502" text-anchor="middle" font-size="13.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">入库归档</text>
<text x="1066" y="528" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">写入对应画像层</text>
<text x="1066" y="546" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">版本号 +0.1</text>
<text x="1066" y="574" text-anchor="middle" font-size="9.5" fill="#ff8c00" font-family="JetBrains Mono, monospace">语料移入归档区</text>
<text x="1066" y="596" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">下次任务即生效</text>

<!-- 闭环返回路径 -->
<path d="M 1066 618 L 1066 652 L 162 652 L 162 622" fill="none" stroke="#7a7a85" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#l-gray)"/>
<rect x="420" y="630" width="360" height="22" rx="4" fill="#0a0a0f"/>
<text x="600" y="646" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">循环：新规则在下一轮任务被引用（学习效果可观察），语料与画像版本持续演进</text>

<!-- ═══ 三条铁律 ═══ -->
<rect x="66" y="688" width="340" height="92" rx="10" fill="#12121a" fill-opacity="0.8" stroke="#2a2a35" stroke-width="1.2"/>
<text x="82" y="714" text-anchor="start" font-size="12" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">铁律 1 · 未确认不入库</text>
<text x="82" y="736" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">任何内容未经用户确认不得写入画像层，防记忆投毒</text>
<text x="82" y="754" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">用户始终是进化方向的最终拍板人</text>

<rect x="430" y="688" width="340" height="92" rx="10" fill="#12121a" fill-opacity="0.8" stroke="#2a2a35" stroke-width="1.2"/>
<text x="446" y="714" text-anchor="start" font-size="12" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">铁律 2 · 语料永不删除</text>
<text x="446" y="736" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">原始语料完整保留在归档区</text>
<text x="446" y="754" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">画像可随时从语料重建</text>

<rect x="794" y="688" width="340" height="92" rx="10" fill="#12121a" fill-opacity="0.8" stroke="#2a2a35" stroke-width="1.2"/>
<text x="810" y="714" text-anchor="start" font-size="12" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">铁律 3 · 淘汰防膨胀</text>
<text x="810" y="736" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">条目连续 3 个月未被引用 → 归档候选</text>
<text x="810" y="754" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">先归档后删除，保留恢复能力</text>

<text x="600" y="801" text-anchor="middle" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">复盘 R1 实测：星枢案例反向校准，正例确认 13 条规则有效 + 偏差定位 4 项全部闭环入库</text>
</svg>