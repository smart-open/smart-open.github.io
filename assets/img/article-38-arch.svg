<text x="755.0" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#ff8c00" font-family="JetBrains Mono, monospace">dsh-headless</text>
<text x="755.0" y="176" text-anchor="middle" font-size="10" fill="#7a7a85">一次性执行器</text>
<text x="755.0" y="193" text-anchor="middle" font-size="10" fill="#7a7a85">无服务器 / 纯 CLI</text>
<text x="755.0" y="210" text-anchor="middle" font-size="10" fill="#7a7a85">搭配 headless profile</text>
