<rect width="1200" height="710" fill="#0a0a0f"/>
<text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8ec">DeepSeek Harness 整体架构：一切皆插件</text>
<text x="600" y="66" text-anchor="middle" font-size="13" fill="#7a7a85">启动分层组装 Profile / Bundle → Cordis 插件树（无特权内核）→ 运行形态</text>
<text x="36" y="110" font-size="14" font-weight="600" fill="#e8e8ec">启动层：Profile 与 Bundle 分层组装</text>
<text x="660" y="110" font-size="11" fill="#7a7a85">有序叠加，上层 patch 可整行替换下层任意插件配置</text>
<rect x="36" y="126" width="150" height="104" rx="8" fill="#a855f7" fill-opacity="0.06" stroke="#a855f7" stroke-width="1.5"/>
<text x="111" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#a855f7">Profile</text>
<text x="111" y="188" text-anchor="middle" font-size="10" fill="#7a7a85">命名组合模板</text>
<text x="111" y="208" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">web / headless</text>
<rect x="210" y="126" width="250" height="104" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<text x="335.0" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#00ff88" font-family="JetBrains Mono, monospace">dsh-base 基础层</text>
<text x="335.0" y="176" text-anchor="middle" font-size="10" fill="#7a7a85">模型适配器 / 工具注册表</text>
<text x="335.0" y="193" text-anchor="middle" font-size="10" fill="#7a7a85">会话日志 / 持久化</text>
<text x="335.0" y="210" text-anchor="middle" font-size="10" fill="#7a7a85">沙箱 / 审批策略 / 遥测</text>
<text x="335.0" y="227" text-anchor="middle" font-size="10" fill="#7a7a85">设置 / 凭据</text>
<rect x="480" y="126" width="180" height="104" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<text x="570.0" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#00f0ff" font-family="JetBrains Mono, monospace">dsh-web-app</text>
<text x="570.0" y="176" text-anchor="middle" font-size="10" fill="#7a7a85">浏览器应用 / Web UI</text>
<text x="570.0" y="193" text-anchor="middle" font-size="10" fill="#7a7a85">对话节点 / 编辑器联动</text>
<text x="570.0" y="210" text-anchor="middle" font-size="10" fill="#7a7a85">搭配 web profile</text>
