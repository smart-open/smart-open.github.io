<text x="456" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#00f0ff">Headless</text>
<text x="456" y="618" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">dsh-headless 一次性执行</text>
<text x="456" y="636" text-anchor="middle" font-size="10" fill="#7a7a85">无服务器 / 脚本化</text>
<rect x="612" y="568" width="264" height="82" rx="8" fill="#ff8c00" fill-opacity="0.05" stroke="#ff8c00" stroke-width="1.2"/>
<text x="744" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#ff8c00">ACP / JSON-RPC</text>
