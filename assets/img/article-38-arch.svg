<text x="744" y="636" text-anchor="middle" font-size="10" fill="#7a7a85">stdio JSON-RPC 自动化</text>
<rect x="900" y="568" width="264" height="82" rx="8" fill="#a855f7" fill-opacity="0.05" stroke="#a855f7" stroke-width="1.2"/>
<text x="1032" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#a855f7">Python SDK</text>
<text x="1032" y="618" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">python/ 目录</text>
<text x="1032" y="636" text-anchor="middle" font-size="10" fill="#7a7a85">脚本驱动同一内核</text>
