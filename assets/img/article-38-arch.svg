<line x1="462" y1="178" x2="476" y2="178" stroke="#7a7a85" stroke-width="2" marker-end="url(#m-gray)"/>
<line x1="662" y1="178" x2="676" y2="178" stroke="#7a7a85" stroke-width="2" marker-end="url(#m-gray)"/>
<rect x="860" y="126" width="304" height="104" rx="8" fill="#ff4466" fill-opacity="0.04" stroke="#ff4466" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="1012" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#ff4466">Patch 逐层覆盖</text>
<text x="1012" y="178" text-anchor="middle" font-size="10.5" fill="#7a7a85">① profile 内 cordis.patch.yml</text>
<text x="1012" y="197" text-anchor="middle" font-size="10.5" fill="#7a7a85">② Harness home 全局 patch</text>
<text x="1012" y="216" text-anchor="middle" font-size="10.5" fill="#7a7a85">③ --patch 命令行覆盖</text>
<line x1="832" y1="178" x2="856" y2="178" stroke="#ff4466" stroke-width="2" marker-end="url(#m-red)"/>
<text x="36" y="256" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">dsh --profile web --dump-config   # 查看本机实际启动的完整插件树</text>
<text x="36" y="276" font-size="14" font-weight="600" fill="#e8e8ec">Cordis 插件树：无特权内核，产品即插件</text>
<text x="660" y="276" font-size="11" fill="#7a7a85">模型适配器、工具注册表、会话日志、Agent 循环本身都是插件，皆可被配置替换</text>
<rect x="36" y="294" width="174" height="118" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
