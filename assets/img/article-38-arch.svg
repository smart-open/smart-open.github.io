<text x="499.0" y="350" text-anchor="middle" font-size="11" fill="#ff8c00" font-family="JetBrains Mono, monospace">ctx.agents</text>
<text x="499.0" y="376" text-anchor="middle" font-size="9.5" fill="#7a7a85">Agent 接口 / 活动注册</text>
<text x="499.0" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85">agent/* 事件域</text>
<rect x="600" y="294" width="174" height="118" rx="8" fill="#a855f7" fill-opacity="0.05" stroke="#a855f7" stroke-width="1.5"/>
<rect x="600" y="294" width="174" height="4" rx="2" fill="#a855f7"/>
<text x="687.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e8ec" font-family="JetBrains Mono, monospace">core/agent-loop</text>
<rect x="630" y="336" width="114" height="20" rx="4" fill="#12121a"/>
<text x="687.0" y="350" text-anchor="middle" font-size="11" fill="#a855f7" font-family="JetBrains Mono, monospace">ctx.agentLoop</text>
<text x="687.0" y="376" text-anchor="middle" font-size="9.5" fill="#7a7a85">默认驱动器实现</text>
<text x="687.0" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85">turn/step 调度</text>
<rect x="788" y="294" width="174" height="118" rx="8" fill="#ff4466" fill-opacity="0.05" stroke="#ff4466" stroke-width="1.5"/>
<rect x="788" y="294" width="174" height="4" rx="2" fill="#ff4466"/>
<text x="875.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e8ec" font-family="JetBrains Mono, monospace">llm/llm</text>
