<rect x="976" y="294" width="174" height="4" rx="2" fill="#7a7a85"/>
<text x="1063.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e8ec" font-family="JetBrains Mono, monospace">core/system-prompt</text>
<rect x="1006" y="336" width="114" height="20" rx="4" fill="#12121a"/>
<text x="1063.0" y="350" text-anchor="middle" font-size="11" fill="#7a7a85" font-family="JetBrains Mono, monospace">ctx.systemPrompt</text>
<text x="1063.0" y="376" text-anchor="middle" font-size="9.5" fill="#7a7a85">提示词段落组装</text>
<text x="1063.0" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85">工具 Schema 投影</text>
<text x="36" y="446" font-size="14" font-weight="600" fill="#e8e8ec">能力接缝 Capability Seams：换一个 Provider，整个产品换世界</text>
<rect x="36" y="456" width="536" height="72" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.2"/>
<text x="54" y="484" font-size="11.5" font-weight="700" fill="#00ff88" font-family="JetBrains Mono, monospace">ctx.fs / ctx.shell / ctx.subprocess</text>
<text x="54" y="508" font-size="10.5" fill="#7a7a85">文件系统 / Shell / 子进程共享一个执行世界，指向远程沙箱时 Bash、PTY、LSP 随之迁移</text>
<rect x="628" y="456" width="536" height="72" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.2"/>
<text x="646" y="484" font-size="11.5" font-weight="700" fill="#00f0ff" font-family="JetBrains Mono, monospace">ctx.sandbox / ctx.terminals</text>
<text x="646" y="508" font-size="10.5" fill="#7a7a85">Landlock / sandbox-exec 原生沙箱后端；持久终端由后端 + 工具插件组合提供</text>
<text x="36" y="556" font-size="14" font-weight="600" fill="#e8e8ec">运行形态：同一插件树，多种宿主</text>
<rect x="36" y="568" width="264" height="82" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.2"/>
<text x="168" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#00ff88">Web UI</text>
<text x="168" y="618" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">npx @deepseek-ai/dsh web</text>
<text x="168" y="636" text-anchor="middle" font-size="10" fill="#7a7a85">默认 127.0.0.1:3080</text>
