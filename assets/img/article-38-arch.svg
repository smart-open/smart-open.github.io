<text x="123.0" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e8ec" font-family="JetBrains Mono, monospace">core/session</text>
<rect x="66" y="336" width="114" height="20" rx="4" fill="#12121a"/>
