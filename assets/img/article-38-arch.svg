<text x="311.0" y="376" text-anchor="middle" font-size="9.5" fill="#7a7a85">作用域工具注册表</text>
<text x="311.0" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85">守卫执行管线</text>
