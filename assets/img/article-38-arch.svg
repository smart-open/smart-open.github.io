<line x1="600" y1="420" x2="600" y2="456" stroke="#7a7a85" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
<line x1="600" y1="532" x2="600" y2="568" stroke="#7a7a85" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
<text x="600" y="686" text-anchor="middle" font-size="10" fill="#7a7a85" opacity="0.6">扩展 dsh 的唯一方式：在其它插件旁挂载你自己的插件——注册即效应，卸载即回滚</text>
