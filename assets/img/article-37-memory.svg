<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
<defs>
<marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00ff88"/></marker>
<marker id="m-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00f0ff"/></marker>
<marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8c00"/></marker>
<marker id="m-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff4466"/></marker>
<marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
<marker id="m-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a85"/></marker>
</defs>
<rect width="1200" height="800" fill="#0a0a0f"/>
<text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8ec">JVM 运行时内存结构（JDK 8+）</text>
<text x="600" y="66" text-anchor="middle" font-size="13" fill="#7a7a85">线程私有区 × 共享堆 × 非堆区域：GC 主战场是堆，类元数据自 JDK 8 起迁往本地内存 Metaspace</text>
<rect x="36" y="96" width="210" height="450" rx="8" fill="#a855f7" fill-opacity="0.04" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="141" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#a855f7">线程私有区</text>
<text x="141" y="140" text-anchor="middle" font-size="10" fill="#7a7a85">随线程创建销毁 · 不参与GC</text>
<rect x="48" y="158" width="186" height="118" rx="8" fill="#12121a" stroke="#a855f7" stroke-width="1"/>
<text x="141" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8ec">程序计数器</text>
<text x="141" y="202" text-anchor="middle" font-size="9" fill="#a855f7" font-family="JetBrains Mono, monospace">PC Register</text>
<text x="141" y="224" text-anchor="middle" font-size="10" fill="#7a7a85">当前字节码行号</text>
<text x="141" y="242" text-anchor="middle" font-size="10" fill="#7a7a85">唯一无 OOM 区域</text>
<rect x="48" y="288" width="186" height="118" rx="8" fill="#12121a" stroke="#a855f7" stroke-width="1"/>
<text x="141" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8ec">虚拟机栈</text>
<text x="141" y="332" text-anchor="middle" font-size="9" fill="#a855f7" font-family="JetBrains Mono, monospace">VM Stack</text>
<text x="141" y="354" text-anchor="middle" font-size="10" fill="#7a7a85">栈帧: 局部变量表</text>
<text x="141" y="372" text-anchor="middle" font-size="10" fill="#7a7a85">操作数栈/动态链接</text>
<text x="141" y="390" text-anchor="middle" font-size="10" fill="#7a7a85">StackOverflowError</text>
<text x="141" y="408" text-anchor="middle" font-size="10" fill="#7a7a85">-Xss 控制深度</text>
<rect x="48" y="436" width="186" height="118" rx="8" fill="#12121a" stroke="#a855f7" stroke-width="1"/>
<text x="141" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8ec">本地方法栈</text>
<text x="141" y="480" text-anchor="middle" font-size="9" fill="#a855f7" font-family="JetBrains Mono, monospace">Native Stack</text>
<text x="141" y="502" text-anchor="middle" font-size="10" fill="#7a7a85">native 方法服务</text>
<text x="141" y="520" text-anchor="middle" font-size="10" fill="#7a7a85">HotSpot 与虚拟机栈合并</text>
<rect x="286" y="96" width="560" height="450" rx="8" fill="#00f0ff" fill-opacity="0.04" stroke="#00f0ff" stroke-width="1.5"/>
<rect x="286" y="96" width="560" height="4" rx="2" fill="#00f0ff"/>
<text x="302" y="126" font-size="14" font-weight="700" fill="#00f0ff">Java 堆（GC 主战场）</text>
<text x="830" y="126" text-anchor="end" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">-Xms / -Xmx</text>
<rect x="302" y="142" width="528" height="196" rx="8" fill="#00ff88" fill-opacity="0.04" stroke="#00ff88" stroke-width="1.2"/>
<text x="316" y="166" font-size="12" font-weight="700" fill="#00ff88">新生代 Young</text>
<text x="316" y="183" font-size="10" fill="#7a7a85">对象优先在 Eden 分配（TLAB 线程私有缓冲）</text>
<rect x="318" y="196" width="302" height="120" rx="6" fill="#00ff88" fill-opacity="0.07" stroke="#00ff88" stroke-width="1.2"/>
<text x="469.0" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#00ff88">Eden</text>
<text x="469.0" y="274" text-anchor="middle" font-size="10" fill="#7a7a85">8 份</text>
<rect x="664.0" y="196" width="53" height="120" rx="6" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-width="1.2"/>
<text x="690.5" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#00f0ff">S0</text>
<text x="690.5" y="274" text-anchor="middle" font-size="10" fill="#7a7a85">1 份</text>
<rect x="761.0" y="196" width="53" height="120" rx="6" fill="#ff8c00" fill-opacity="0.07" stroke="#ff8c00" stroke-width="1.2"/>
<text x="787.5" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#ff8c00">S1</text>
<text x="787.5" y="274" text-anchor="middle" font-size="10" fill="#7a7a85">1 份</text>
<text x="816" y="338" text-anchor="end" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">SurvivorRatio=8 · 动态年龄判定晋升</text>
<rect x="302" y="352" width="528" height="110" rx="8" fill="#ff8c00" fill-opacity="0.04" stroke="#ff8c00" stroke-width="1.2"/>
<text x="316" y="380" font-size="12" font-weight="700" fill="#ff8c00">老年代 Old</text>
<text x="316" y="400" font-size="10" fill="#7a7a85">长期存活对象 · 大对象直接分配（-XX:PretenureSizeThreshold）</text>
<text x="316" y="420" font-size="10" fill="#7a7a85">NewRatio=2（Young:Old = 1:2）· MaxTenuringThreshold=15</text>
<text x="316" y="440" font-size="10" fill="#7a7a85">标量替换/逃逸分析可让对象栈上分配，绕过堆</text>
<line x1="406" y1="344" x2="406" y2="346" stroke="#00ff88" stroke-width="2" marker-end="url(#m-green)"/>
<text x="418" y="350" font-size="10" fill="#00ff88">Minor GC 复制算法 · 年龄+1 晋升</text>
<line x1="716" y1="344" x2="716" y2="346" stroke="#ff4466" stroke-width="2" marker-end="url(#m-red)"/>
<text x="728" y="350" font-size="10" fill="#ff4466">Full GC · 全堆STW</text>
<text x="566" y="530" text-anchor="middle" font-size="10" fill="#7a7a85">分代假说: 绝大多数对象朝生夕死，按存活时间分区回收可大幅降低单次回收成本</text>
<rect x="886" y="96" width="278" height="450" rx="8" fill="#ff8c00" fill-opacity="0.04" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="1025" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#ff8c00">非堆区域（本地内存）</text>
<rect x="898" y="142" width="254" height="118" rx="8" fill="#12121a" stroke="#00ff88" stroke-width="1"/>
<text x="1025" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#e8e8ec">Metaspace 元空间</text>
<text x="1025" y="192" text-anchor="middle" font-size="10" fill="#7a7a85">类元数据 · 运行时常量池</text>
<text x="1025" y="210" text-anchor="middle" font-size="10" fill="#7a7a85">JDK 8 取代 PermGen</text>
<text x="1025" y="228" text-anchor="middle" font-size="10" fill="#7a7a85">动态扩容 · MaxMetaspaceSize</text>
<text x="1025" y="246" text-anchor="middle" font-size="10" fill="#7a7a85">OOM: Metaspace</text>
<rect x="898" y="288" width="254" height="100" rx="8" fill="#12121a" stroke="#00f0ff" stroke-width="1"/>
<text x="1025" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#e8e8ec">Code Cache 代码缓存</text>
<text x="1025" y="338" text-anchor="middle" font-size="10" fill="#7a7a85">JIT 编译后的本地代码</text>
<text x="1025" y="356" text-anchor="middle" font-size="10" fill="#7a7a85">ReservedCodeCacheSize</text>
<text x="1025" y="374" text-anchor="middle" font-size="10" fill="#7a7a85">代码缓存满触发去优化</text>
<rect x="898" y="418" width="254" height="118" rx="8" fill="#12121a" stroke="#ff4466" stroke-width="1"/>
<text x="1025" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#e8e8ec">直接内存 Direct Memory</text>
<text x="1025" y="468" text-anchor="middle" font-size="10" fill="#7a7a85">NIO DirectByteBuffer</text>
<text x="1025" y="486" text-anchor="middle" font-size="10" fill="#7a7a85">不受 -Xmx 约束</text>
<text x="1025" y="504" text-anchor="middle" font-size="10" fill="#7a7a85">MaxDirectMemorySize 控制</text>
<text x="1025" y="522" text-anchor="middle" font-size="10" fill="#7a7a85">溢出同样触发 OOM</text>
<text x="36" y="586" font-size="14" font-weight="600" fill="#e8e8ec">内存区域演进：永久代 → 元空间</text>
<rect x="36" y="606" width="520" height="150" rx="8" fill="#ff4466" fill-opacity="0.05" stroke="#ff4466" stroke-width="1.5"/>
<rect x="36" y="606" width="520" height="4" rx="2" fill="#ff4466"/>
<text x="60" y="640" font-size="13" font-weight="700" fill="#ff4466">JDK 7 及以前 · 永久代 PermGen</text>
<text x="60" y="668" font-size="11" fill="#7a7a85">位于堆内 · MaxPermSize 固定上限</text>
<text x="60" y="690" font-size="11" fill="#7a7a85">类元数据 + 字符串常量池 + 类静态变量</text>
<text x="60" y="712" font-size="11" fill="#7a7a85">动态类加载易 OOM: PermGen space</text>
<text x="60" y="734" font-size="11" fill="#7a7a85">Full GC 时随老年代一起回收</text>
<line x1="572" y1="681" x2="628" y2="681" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#m-cyan)"/>
<text x="600" y="666" text-anchor="middle" font-size="10" fill="#00f0ff">JDK 8</text>
<rect x="644" y="606" width="520" height="150" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<rect x="644" y="606" width="520" height="4" rx="2" fill="#00ff88"/>
<text x="668" y="640" font-size="13" font-weight="700" fill="#00ff88">JDK 8+ · 元空间 Metaspace</text>
<text x="668" y="668" font-size="11" fill="#7a7a85">位于本地内存 · 默认动态扩容</text>
<text x="668" y="690" font-size="11" fill="#7a7a85">仅存类元数据（常量池/静态变量已入堆）</text>
<text x="668" y="712" font-size="11" fill="#7a7a85">MaxMetaspaceSize 兜底 · CompressedClassSpace</text>
<text x="668" y="734" font-size="11" fill="#7a7a85">与堆解耦，Full GC 不再受 PermGen 拖累</text>
</svg>