<text x="560.0" y="489.0" font-size="10.5" fill="#7a7a85" text-anchor="middle">质检 · 护栏 · 合规</text>
<rect x="740" y="230" width="150" height="100" rx="8" fill="#1c1c26" stroke="#2a2a35" stroke-width="1"/>
<text x="815.0" y="286.0" font-size="13" font-weight="600" fill="#e8e8ec" text-anchor="middle">结果聚合</text>
<text x="815.0" y="304.0" font-size="10.5" fill="#7a7a85" text-anchor="middle">引用 · 冲突消解</text>
<rect x="740" y="400" width="150" height="70" rx="8" fill="#1c1c26" stroke="#2a2a35" stroke-width="1"/>
<text x="815.0" y="440.0" font-size="13" font-weight="600" fill="#e8e8ec" text-anchor="middle">交付 / 回答</text>
