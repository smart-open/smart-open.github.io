<text x="560.0" y="249.0" font-size="10.5" fill="#7a7a85" text-anchor="middle">SQL · 图表 · 统计</text>
<rect x="460" y="300" width="200" height="90" rx="8" fill="#1c1c26" stroke="#2a2a35" stroke-width="1"/>
<text x="560.0" y="351.0" font-size="13" font-weight="600" fill="#e8e8ec" text-anchor="middle">编码 Agent</text>
<text x="560.0" y="369.0" font-size="10.5" fill="#7a7a85" text-anchor="middle">沙箱内生成并执行</text>
