<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Inter, sans-serif">
<defs>
<marker id="m-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00f0ff"/></marker>
<marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00ff88"/></marker>
<marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8c00"/></marker>
<marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
<marker id="m-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a85"/></marker>
</defs>
<rect width="1200" height="740" fill="#0a0a0f"/>
<text x="600" y="42" text-anchor="middle" font-size="22" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">RPC 多路复用全链路：一条连接，N 个并发请求</text>
<text x="600" y="66" text-anchor="middle" font-size="13" fill="#7a7a85" font-family="Inter, sans-serif">客户端 Pending Map 与连接池 · 一条 TCP 物理连接 · 服务端 EventLoop 与业务线程池</text>
<rect x="36" y="96" width="320" height="564" rx="12" fill="#12121a" fill-opacity="0.5" stroke="#2a2a35" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="56" y="126" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">客户端进程 Client</text>
<rect x="48" y="142" width="94" height="54" rx="6" fill="#12121a" stroke="#2a2a35" stroke-width="1.2"/>
<text x="95" y="166" text-anchor="middle" font-size="11.5" fill="#e8e8ec" font-family="Inter, sans-serif">调用线程 A</text>
<text x="95" y="184" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getUser()</text>
<rect x="149" y="142" width="94" height="54" rx="6" fill="#12121a" stroke="#2a2a35" stroke-width="1.2"/>
<text x="196" y="166" text-anchor="middle" font-size="11.5" fill="#e8e8ec" font-family="Inter, sans-serif">调用线程 B</text>
<text x="196" y="184" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getOrders()</text>
<rect x="250" y="142" width="94" height="54" rx="6" fill="#12121a" stroke="#2a2a35" stroke-width="1.2"/>
<text x="297" y="166" text-anchor="middle" font-size="11.5" fill="#e8e8ec" font-family="Inter, sans-serif">调用线程 C</text>
<text x="297" y="184" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getStats()</text>
<line x1="196" y1="200" x2="196" y2="226" stroke="#7a7a85" stroke-width="1.5" marker-end="url(#m-gray)"/>
<text x="210" y="217" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">acquire · 生成 requestId</text>
<rect x="56" y="232" width="280" height="80" rx="8" fill="#ff8c00" fill-opacity="0.05" stroke="#ff8c00" stroke-width="1.5"/>
<rect x="60" y="232" width="272" height="3" rx="1.5" fill="#ff8c00"/>
<text x="196" y="258" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">连接池 ConnectionPool</text>
<text x="196" y="278" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">控制连接数 · 故障隔离 · 提供背压</text>
<text x="196" y="296" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">连接复用，减少握手与 TLS 开销</text>
<line x1="196" y1="316" x2="196" y2="342" stroke="#7a7a85" stroke-width="1.5" marker-end="url(#m-gray)"/>
<text x="210" y="333" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">注册 pending</text>
<rect x="56" y="348" width="280" height="96" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<rect x="60" y="348" width="272" height="3" rx="1.5" fill="#00f0ff"/>
<text x="196" y="372" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">Pending Map（挂在 Channel 上）</text>
<rect x="96" y="384" width="200" height="20" rx="4" fill="#12121a"/>
<text x="196" y="398" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace">requestId → CompletableFuture</text>
<text x="196" y="422" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">连接内唯一 · 完成即移除</text>
<text x="196" y="438" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">响应到达 → complete() 唤醒调用线程</text>
<rect x="56" y="470" width="280" height="120" rx="8" fill="#ff4466" fill-opacity="0.05" stroke="#ff4466" stroke-width="1.5"/>
<text x="196" y="494" text-anchor="middle" font-size="12" fill="#ff4466" font-family="Inter, sans-serif" font-weight="700">生命周期治理（生产必配）</text>
<rect x="66" y="506" width="128" height="30" rx="4" fill="#0a0a0f" stroke="#2a2a35" stroke-width="1"/>
<text x="130" y="525" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">超时清理定时器</text>
<rect x="202" y="506" width="128" height="30" rx="4" fill="#0a0a0f" stroke="#2a2a35" stroke-width="1"/>
<text x="266" y="525" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">连接关闭批量取消</text>
<rect x="66" y="544" width="128" height="30" rx="4" fill="#0a0a0f" stroke="#2a2a35" stroke-width="1"/>
<text x="130" y="563" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">写失败立即移除</text>
<rect x="202" y="544" width="128" height="30" rx="4" fill="#0a0a0f" stroke="#2a2a35" stroke-width="1"/>
<text x="266" y="563" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">容量上限与背压</text>
<text x="196" y="618" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">调用方：future.get() 同步等待或异步回调</text>
<path d="M336,385 L366,385 L366,252 L400,252" fill="none" stroke="#00f0ff" stroke-width="2" marker-end="url(#m-cyan)"/>
<path d="M400,554 L382,554 L382,415 L336,415" fill="none" stroke="#00ff88" stroke-width="2" marker-end="url(#m-green)"/>
<rect x="400" y="96" width="400" height="564" rx="12" fill="#00f0ff" fill-opacity="0.03" stroke="#00f0ff" stroke-width="1.5"/>
<text x="600" y="126" text-anchor="middle" font-size="14" fill="#00f0ff" font-family="Inter, sans-serif" font-weight="700">一条 TCP 物理连接</text>
<text x="600" y="144" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">长连接 · 全双工 · 帧交错</text>
<text x="416" y="170" text-anchor="start" font-size="11.5" fill="#00f0ff" font-family="Inter, sans-serif" font-weight="700">上行：请求帧交错</text>
<rect x="416" y="180" width="116" height="48" rx="6" fill="#12121a" stroke="#00f0ff" stroke-width="1.2"/>
<text x="474" y="202" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">req#1</text>
<text x="474" y="220" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getUser()</text>
<rect x="542" y="180" width="116" height="48" rx="6" fill="#12121a" stroke="#00f0ff" stroke-width="1.2"/>
<text x="600" y="202" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">req#2</text>
<text x="600" y="220" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getOrders()</text>
<rect x="668" y="180" width="116" height="48" rx="6" fill="#12121a" stroke="#00f0ff" stroke-width="1.2"/>
<text x="726" y="202" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">req#3</text>
<text x="726" y="220" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getStats()</text>
<line x1="416" y1="252" x2="786" y2="252" stroke="#00f0ff" stroke-width="2" marker-end="url(#m-cyan)"/>
<text x="600" y="243" text-anchor="middle" font-size="10" fill="#00f0ff" font-family="JetBrains Mono, monospace">channel.writeAndFlush(requestFrame)</text>
<text x="600" y="306" text-anchor="middle" font-size="20" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">连接 = 铁轨</text>
<text x="600" y="338" text-anchor="middle" font-size="20" fill="#00f0ff" font-family="Inter, sans-serif" font-weight="700">requestId = 车厢编号</text>
<text x="600" y="366" text-anchor="middle" font-size="11.5" fill="#7a7a85" font-family="Inter, sans-serif">多节车厢共享一条轨道，卸货顺序可以不同</text>
<rect x="490" y="384" width="220" height="26" rx="13" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1"/>
<text x="600" y="401" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="Inter, sans-serif">全双工：上行与下行互不阻塞</text>
<text x="416" y="472" text-anchor="start" font-size="11.5" fill="#00ff88" font-family="Inter, sans-serif" font-weight="700">下行：响应帧乱序回写</text>
<rect x="416" y="482" width="116" height="48" rx="6" fill="#12121a" stroke="#00ff88" stroke-width="1.2"/>
<text x="474" y="504" text-anchor="middle" font-size="11" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">resp#3</text>
<text x="474" y="522" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getStats()</text>
<rect x="542" y="482" width="116" height="48" rx="6" fill="#12121a" stroke="#00ff88" stroke-width="1.2"/>
<text x="600" y="504" text-anchor="middle" font-size="11" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">resp#1</text>
<text x="600" y="522" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getUser()</text>
<rect x="668" y="482" width="116" height="48" rx="6" fill="#12121a" stroke="#00ff88" stroke-width="1.2"/>
<text x="726" y="504" text-anchor="middle" font-size="11" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">resp#2</text>
<text x="726" y="522" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">getOrders()</text>
<line x1="784" y1="554" x2="414" y2="554" stroke="#00ff88" stroke-width="2" marker-end="url(#m-green)"/>
<text x="600" y="574" text-anchor="middle" font-size="10" fill="#00ff88" font-family="JetBrains Mono, monospace">先完成先返回，不按请求顺序</text>
<text x="600" y="610" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">帧格式：magic | version | type | requestId | method | body</text>
<rect x="844" y="96" width="320" height="564" rx="12" fill="#12121a" fill-opacity="0.5" stroke="#2a2a35" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="864" y="126" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">服务端进程 Server</text>
<rect x="864" y="142" width="280" height="112" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<rect x="868" y="142" width="272" height="3" rx="1.5" fill="#00f0ff"/>
<text x="1004" y="166" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">Netty EventLoop（I/O 线程）</text>
<rect x="884" y="178" width="118" height="24" rx="4" fill="#0a0a0f" stroke="#2a2a35" stroke-width="1"/>
<text x="943" y="194" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace">Decode 切帧</text>
<rect x="1014" y="178" width="118" height="24" rx="4" fill="#0a0a0f" stroke="#2a2a35" stroke-width="1"/>
<text x="1073" y="194" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace">Dispatch 分发</text>
<text x="1004" y="228" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">只做编解码与分发，绝不执行耗时业务</text>
<line x1="1004" y1="258" x2="1004" y2="300" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#m-orange)"/>
<text x="1018" y="282" text-anchor="start" font-size="10" fill="#ff8c00" font-family="Inter, sans-serif">异步提交，不阻塞 I/O 线程</text>
<rect x="864" y="304" width="280" height="112" rx="8" fill="#ff8c00" fill-opacity="0.05" stroke="#ff8c00" stroke-width="1.5"/>
<rect x="868" y="304" width="272" height="3" rx="1.5" fill="#ff8c00"/>
<text x="1004" y="328" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">业务线程池 ×N</text>
<text x="1004" y="350" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">执行真正的方法调用</text>
<text x="1004" y="368" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">DB / 缓存 / 下游 RPC / 计算</text>
<text x="1004" y="386" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">不同请求在不同线程并发执行</text>
<line x1="1004" y1="420" x2="1004" y2="458" stroke="#00ff88" stroke-width="1.5" marker-end="url(#m-green)"/>
<text x="1018" y="442" text-anchor="start" font-size="10" fill="#00ff88" font-family="JetBrains Mono, monospace">result + 原 requestId</text>
<rect x="864" y="462" width="280" height="112" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<rect x="868" y="462" width="272" height="3" rx="1.5" fill="#00ff88"/>
<text x="1004" y="486" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">响应编排 Encoder</text>
<rect x="894" y="498" width="220" height="22" rx="4" fill="#12121a"/>
<text x="1004" y="513" text-anchor="middle" font-size="10.5" fill="#00ff88" font-family="JetBrains Mono, monospace">ctx.writeAndFlush(resp)</text>
<text x="1004" y="538" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">携带原 requestId · 乱序回写安全</text>
<text x="1004" y="556" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">多线程并发写同一 Channel 线程安全</text>
<text x="1004" y="600" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">写请求进入 Channel 队列</text>
<text x="1004" y="618" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">由绑定的 EventLoop 串行编码写出</text>
<text x="1004" y="636" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="JetBrains Mono, monospace">Channel.writeAndFlush 是线程安全的</text>
<path d="M800,252 L816,252 L816,198 L864,198" fill="none" stroke="#00f0ff" stroke-width="2" marker-end="url(#m-cyan)"/>
<text x="858" y="190" text-anchor="end" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">TCP 字节流</text>
<line x1="864" y1="554" x2="800" y2="554" stroke="#00ff88" stroke-width="2" marker-end="url(#m-green)"/>
<line x1="36" y1="700" x2="76" y2="700" stroke="#00f0ff" stroke-width="2"/>
<text x="84" y="704" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">请求路径</text>
<line x1="156" y1="700" x2="196" y2="700" stroke="#00ff88" stroke-width="2"/>
<text x="204" y="704" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">响应路径</text>
<line x1="276" y1="700" x2="316" y2="700" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="324" y="704" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">异步提交</text>
<text x="1164" y="704" text-anchor="end" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">requestId 贯穿全链路：一次生成，两端透传</text>
</svg>