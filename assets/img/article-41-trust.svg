<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Inter, sans-serif">
<defs>
<marker id="t-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8c00"/></marker>
</defs>
<rect width="1200" height="780" fill="#0a0a0f"/>
<text x="600" y="42" text-anchor="middle" font-size="22" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">信任的建立：每一次请示，都在换画像覆盖度</text>
<text x="600" y="66" text-anchor="middle" font-size="13" fill="#7a7a85" font-family="Inter, sans-serif">信任不是配置出来的，是挣出来的 · 放权幅度永远跟着画像覆盖度走</text>

<!-- ═══ 左：信任飞轮 ═══ -->
<rect x="36" y="92" width="600" height="440" rx="12" fill="#12121a" fill-opacity="0.5" stroke="#2a2a35" stroke-width="1.2"/>
<text x="56" y="120" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">信任飞轮：每转一圈，覆盖度换一次放权</text>

<circle cx="336" cy="330" r="56" fill="#12121a" stroke="#2a2a35" stroke-width="1.2"/>
<text x="336" y="327" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">信任飞轮</text>
<text x="336" y="347" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">覆盖度 ⇄ 放权</text>

<rect x="241" y="156" width="190" height="64" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.3"/>
<text x="336" y="182" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">① L2 请示</text>
<text x="336" y="204" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">画像未覆盖 · 列选项来问</text>

<rect x="383" y="298" width="190" height="64" rx="8" fill="#ff4466" fill-opacity="0.05" stroke="#ff4466" stroke-width="1.3"/>
<text x="478" y="324" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">② 复盘确认入库</text>
<text x="478" y="346" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">用户逐条采纳 · 版本 +0.1</text>

<rect x="241" y="440" width="190" height="64" rx="8" fill="#a855f7" fill-opacity="0.05" stroke="#a855f7" stroke-width="1.3"/>
<text x="336" y="466" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">③ 画像覆盖度 ↑</text>
<text x="336" y="488" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">同类决策进入 L1 自主区</text>

<rect x="99" y="298" width="190" height="64" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.3"/>
<text x="194" y="324" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">④ L1 放权 ↑</text>
<text x="194" y="346" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">同一类问题不再来问</text>

<path d="M 442 228 Q 496 240 504 292" fill="none" stroke="#ff8c00" stroke-width="2" marker-end="url(#t-orange)"/>
<path d="M 470 368 Q 450 420 438 454" fill="none" stroke="#ff8c00" stroke-width="2" marker-end="url(#t-orange)"/>
<path d="M 236 458 Q 200 424 197 368" fill="none" stroke="#ff8c00" stroke-width="2" marker-end="url(#t-orange)"/>
<path d="M 197 292 Q 202 242 236 200" fill="none" stroke="#ff8c00" stroke-width="2" marker-end="url(#t-orange)"/>

<!-- ═══ 右：护栏与红线 ═══ -->
<rect x="660" y="92" width="504" height="440" rx="12" fill="#12121a" fill-opacity="0.5" stroke="#2a2a35" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="680" y="120" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">护栏与红线（放手的前提）</text>

<rect x="680" y="136" width="464" height="118" rx="8" fill="#12121a" fill-opacity="0.8" stroke="#00f0ff" stroke-width="1.2"/>
<text x="700" y="164" text-anchor="start" font-size="12" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">护栏 1 · 决策留痕 100%</text>
<text x="700" y="188" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">每一次放手都有依据可回溯</text>
<text x="700" y="208" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">出问题先看留痕：是修画像还是修流程</text>

<rect x="680" y="262" width="464" height="118" rx="8" fill="#12121a" fill-opacity="0.8" stroke="#00ff88" stroke-width="1.2"/>
<text x="700" y="290" text-anchor="start" font-size="12" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">护栏 2 · review 闸门</text>
<text x="700" y="314" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">信任越高越要守住 review 这一环</text>
<text x="700" y="334" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">review 里的纠正 = 下一轮进化语料</text>

<rect x="680" y="388" width="464" height="118" rx="8" fill="#12121a" fill-opacity="0.8" stroke="#ff4466" stroke-width="1.2"/>
<text x="700" y="416" text-anchor="start" font-size="12" fill="#ff4466" font-family="JetBrains Mono, monospace" font-weight="700">红线 · L3 永不下放</text>
<text x="700" y="440" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">安全操作、不可逆操作、价值判断</text>
<text x="700" y="460" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">信任再高，这三类也回到用户手里</text>

<!-- ═══ 下：放权幅度演进 ═══ -->
<rect x="36" y="552" width="1128" height="164" rx="12" fill="#12121a" fill-opacity="0.5" stroke="#2a2a35" stroke-width="1.2"/>
<text x="56" y="580" text-anchor="start" font-size="14" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">放权幅度演进（比例示意）</text>
<rect x="860" y="571" width="10" height="10" rx="2" fill="#00ff88"/>
<text x="876" y="580" text-anchor="start" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">L1 自主</text>
<rect x="944" y="571" width="10" height="10" rx="2" fill="#00f0ff"/>
<text x="960" y="580" text-anchor="start" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">L2 请示</text>
<rect x="1028" y="571" width="10" height="10" rx="2" fill="#ff4466"/>
<text x="1044" y="580" text-anchor="start" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">L3 强制确认</text>

<text x="148" y="617" text-anchor="end" font-size="11.5" fill="#e8e8ec" font-family="Inter, sans-serif">建立期</text>
<rect x="160" y="600" width="234" height="26" rx="3" fill="#00ff88" fill-opacity="0.25"/>
<text x="277" y="617" text-anchor="middle" font-size="9.5" fill="#00ff88" font-family="Inter, sans-serif">L1 30%</text>
<rect x="394" y="600" width="429" height="26" fill="#00f0ff" fill-opacity="0.25"/>
<text x="608" y="617" text-anchor="middle" font-size="9.5" fill="#00f0ff" font-family="Inter, sans-serif">L2 55%</text>
<rect x="823" y="600" width="117" height="26" rx="3" fill="#ff4466" fill-opacity="0.25"/>
<text x="881" y="617" text-anchor="middle" font-size="9.5" fill="#ff4466" font-family="Inter, sans-serif">L3 15%</text>
<text x="952" y="617" text-anchor="start" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">L2 密集：事事来问</text>

<text x="148" y="655" text-anchor="end" font-size="11.5" fill="#e8e8ec" font-family="Inter, sans-serif">复盘 R1 后</text>
<rect x="160" y="638" width="390" height="26" rx="3" fill="#00ff88" fill-opacity="0.25"/>
<text x="355" y="655" text-anchor="middle" font-size="9.5" fill="#00ff88" font-family="Inter, sans-serif">L1 50%</text>
<rect x="550" y="638" width="312" height="26" fill="#00f0ff" fill-opacity="0.25"/>
<text x="706" y="655" text-anchor="middle" font-size="9.5" fill="#00f0ff" font-family="Inter, sans-serif">L2 40%</text>
<rect x="862" y="638" width="78" height="26" rx="3" fill="#ff4466" fill-opacity="0.25"/>
<text x="901" y="655" text-anchor="middle" font-size="9" fill="#ff4466" font-family="Inter, sans-serif">L3 10%</text>
<text x="952" y="655" text-anchor="start" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">覆盖度上来，请示变少</text>

<text x="148" y="693" text-anchor="end" font-size="11.5" fill="#e8e8ec" font-family="Inter, sans-serif">复盘 R2 起</text>
<rect x="160" y="676" width="546" height="26" rx="3" fill="#00ff88" fill-opacity="0.25"/>
<text x="433" y="693" text-anchor="middle" font-size="9.5" fill="#00ff88" font-family="Inter, sans-serif">L1 70%</text>
<rect x="706" y="676" width="195" height="26" fill="#00f0ff" fill-opacity="0.25"/>
<text x="803" y="693" text-anchor="middle" font-size="9.5" fill="#00f0ff" font-family="Inter, sans-serif">L2 25%</text>
<rect x="901" y="676" width="39" height="26" rx="3" fill="#ff4466" fill-opacity="0.25"/>
<text x="952" y="693" text-anchor="start" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">常规决策不再打扰</text>

<text x="600" y="752" text-anchor="middle" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">比例为示意（非实测数据）：实际放权幅度由画像覆盖度与复盘结果决定，L3 红线在任何阶段都不下放</text>
</svg>