<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Inter, sans-serif">
<defs>
<marker id="m-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00f0ff"/></marker>
<marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00ff88"/></marker>
<marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8c00"/></marker>
<marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
<marker id="m-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff4466"/></marker>
<marker id="m-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a85"/></marker>
</defs>
<rect width="1200" height="880" fill="#0a0a0f"/>
<text x="600" y="42" text-anchor="middle" font-size="20" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">app-server 协议生命周期：一次 Turn 的完整事件流</text>
<text x="600" y="64" text-anchor="middle" font-size="12" fill="#7a7a85" font-family="Inter, sans-serif">JSON-RPC 2.0 · 沙箱内自主执行，越界时回到审批，全程事件流式下发</text>
<rect x="60" y="78" width="170" height="44" rx="8" fill="#12121a" stroke="#a855f7" stroke-width="1.4"/>
<text x="145" y="96" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">宿主应用</text>
<text x="145" y="113" text-anchor="middle" font-size="9.5" fill="#a855f7" font-family="JetBrains Mono, monospace">你的产品</text>
<rect x="295" y="78" width="190" height="44" rx="8" fill="#12121a" stroke="#00f0ff" stroke-width="1.4"/>
<text x="390" y="96" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">app-server</text>
<text x="390" y="113" text-anchor="middle" font-size="9.5" fill="#00f0ff" font-family="JetBrains Mono, monospace">JSON-RPC</text>
<rect x="540" y="78" width="200" height="44" rx="8" fill="#12121a" stroke="#00ff88" stroke-width="1.4"/>
<text x="640" y="96" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">Agent Loop</text>
<text x="640" y="113" text-anchor="middle" font-size="9.5" fill="#00ff88" font-family="JetBrains Mono, monospace">harness 核心</text>
<rect x="780" y="78" width="180" height="44" rx="8" fill="#12121a" stroke="#ff8c00" stroke-width="1.4"/>
<text x="870" y="96" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">平台沙箱</text>
<text x="870" y="113" text-anchor="middle" font-size="9.5" fill="#ff8c00" font-family="JetBrains Mono, monospace">Seatbelt/bwrap</text>
<rect x="1005" y="78" width="170" height="44" rx="8" fill="#12121a" stroke="#ff4466" stroke-width="1.4"/>
<text x="1090" y="96" text-anchor="middle" font-size="12.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">模型</text>
<text x="1090" y="113" text-anchor="middle" font-size="9.5" fill="#ff4466" font-family="JetBrains Mono, monospace">Responses API</text>
<line x1="145" y1="122" x2="145" y2="812" stroke="#2a2a35" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="390" y1="122" x2="390" y2="812" stroke="#2a2a35" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="640" y1="122" x2="640" y2="812" stroke="#2a2a35" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="870" y1="122" x2="870" y2="812" stroke="#2a2a35" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="1090" y1="122" x2="1090" y2="812" stroke="#2a2a35" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="139" y="146" width="12" height="648" rx="2" fill="#a855f7" fill-opacity="0.15"/>
<rect x="384" y="152" width="12" height="64" rx="2" fill="#00f0ff" fill-opacity="0.22"/>
<rect x="384" y="228" width="12" height="640" rx="2" fill="#00f0ff" fill-opacity="0.22"/>
<rect x="634" y="252" width="12" height="536" rx="2" fill="#00ff88" fill-opacity="0.22"/>
<rect x="864" y="356" width="12" height="44" rx="2" fill="#ff8c00" fill-opacity="0.22"/>
<rect x="864" y="452" width="12" height="44" rx="2" fill="#ff8c00" fill-opacity="0.22"/>
<rect x="864" y="632" width="12" height="44" rx="2" fill="#ff8c00" fill-opacity="0.22"/>
<rect x="1084" y="300" width="12" height="230" rx="2" fill="#ff4466" fill-opacity="0.22"/>
<line x1="145" y1="160" x2="390" y2="160" stroke="#a855f7" stroke-width="2" marker-end="url(#m-purple)"/>
<text x="268" y="152" text-anchor="middle" font-size="11" fill="#a855f7" font-family="JetBrains Mono, monospace">initialize { clientInfo }</text>
<line x1="390" y1="186" x2="145" y2="186" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#m-cyan)"/>
<text x="268" y="178" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace">result: userAgent / platform</text>
<line x1="145" y1="212" x2="390" y2="212" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-purple)"/>
<text x="268" y="204" text-anchor="middle" font-size="11" fill="#a855f7" font-family="JetBrains Mono, monospace">initialized（通知）</text>
<line x1="145" y1="244" x2="390" y2="244" stroke="#a855f7" stroke-width="2" marker-end="url(#m-purple)"/>
<text x="268" y="236" text-anchor="middle" font-size="11" fill="#a855f7" font-family="JetBrains Mono, monospace">thread/start { model }</text>
<line x1="390" y1="270" x2="145" y2="270" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-cyan)"/>
<text x="268" y="262" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace">thread/started → threadId</text>
<line x1="145" y1="300" x2="390" y2="300" stroke="#a855f7" stroke-width="2" marker-end="url(#m-purple)"/>
<text x="268" y="292" text-anchor="middle" font-size="11" fill="#a855f7" font-family="JetBrains Mono, monospace">turn/start { threadId, input }</text>
<line x1="390" y1="328" x2="640" y2="328" stroke="#00ff88" stroke-width="1.5" marker-end="url(#m-green)"/>
<text x="515" y="320" text-anchor="middle" font-size="11" fill="#00ff88" font-family="JetBrains Mono, monospace">驱动一轮生成</text>
<line x1="640" y1="356" x2="1090" y2="356" stroke="#ff4466" stroke-width="2" marker-end="url(#m-red)"/>
<text x="865" y="348" text-anchor="middle" font-size="11" fill="#ff4466" font-family="JetBrains Mono, monospace">推理请求（上下文 + 工具）</text>
<line x1="1090" y1="384" x2="640" y2="384" stroke="#ff4466" stroke-width="1.5" marker-end="url(#m-red)"/>
<text x="865" y="376" text-anchor="middle" font-size="11" fill="#ff4466" font-family="JetBrains Mono, monospace">流式输出 + 工具调用意图</text>
<line x1="640" y1="420" x2="870" y2="420" stroke="#ff8c00" stroke-width="2" marker-end="url(#m-orange)"/>
<text x="755" y="412" text-anchor="middle" font-size="11" fill="#ff8c00" font-family="JetBrains Mono, monospace">exec(bash ls)（边界内，免审批）</text>
<line x1="870" y1="448" x2="640" y2="448" stroke="#ff8c00" stroke-width="1.5" marker-end="url(#m-orange)"/>
<text x="755" y="440" text-anchor="middle" font-size="11" fill="#ff8c00" font-family="JetBrains Mono, monospace">stdout / exit</text>
<line x1="390" y1="478" x2="145" y2="478" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-cyan)"/>
<text x="268" y="470" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace">item/started → completed（命令项）</text>
<line x1="640" y1="510" x2="1090" y2="510" stroke="#ff4466" stroke-width="2" marker-end="url(#m-red)"/>
<text x="865" y="502" text-anchor="middle" font-size="11" fill="#ff4466" font-family="JetBrains Mono, monospace">下一轮推理（需要网络）</text>
<line x1="390" y1="538" x2="145" y2="538" stroke="#ff4466" stroke-width="2" marker-end="url(#m-red)"/>
<text x="268" y="530" text-anchor="middle" font-size="11" fill="#ff4466" font-family="JetBrains Mono, monospace">approval/request（越界：访问网络）</text>
<line x1="145" y1="566" x2="390" y2="566" stroke="#a855f7" stroke-width="2" marker-end="url(#m-purple)"/>
<text x="268" y="558" text-anchor="middle" font-size="11" fill="#a855f7" font-family="JetBrains Mono, monospace">approve（用户或 auto_review）</text>
<line x1="640" y1="596" x2="870" y2="596" stroke="#ff8c00" stroke-width="2" marker-end="url(#m-orange)"/>
<text x="755" y="588" text-anchor="middle" font-size="11" fill="#ff8c00" font-family="JetBrains Mono, monospace">exec(curl api)（放行后）</text>
<line x1="390" y1="646" x2="145" y2="646" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-cyan)"/>
<text x="268" y="638" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace">item/agentMessage/delta ×N（流式增量）</text>
<line x1="390" y1="676" x2="145" y2="676" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-cyan)"/>
<text x="268" y="668" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="JetBrains Mono, monospace">item/completed（最终消息）</text>
<line x1="390" y1="706" x2="145" y2="706" stroke="#00ff88" stroke-width="2" marker-end="url(#m-green)"/>
<text x="268" y="698" text-anchor="middle" font-size="11" fill="#00ff88" font-family="JetBrains Mono, monospace">turn/completed { usage }</text>
<rect x="60" y="736" width="1080" height="64" rx="8" fill="#12121a" stroke="#2a2a35" stroke-width="1"/>
<text x="76" y="758" text-anchor="start" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">turn/steer</text>
<text x="160" y="758" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">向进行中的 turn 追加输入，不打断当前工作</text>
<text x="76" y="778" text-anchor="start" font-size="10.5" fill="#ff4466" font-family="JetBrains Mono, monospace" font-weight="700">turn/interrupt</text>
<text x="182" y="778" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">取消执行 → status: interrupted</text>
<text x="560" y="758" text-anchor="start" font-size="10.5" fill="#a855f7" font-family="JetBrains Mono, monospace" font-weight="700">thread/compact/start</text>
<text x="676" y="758" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">触发历史压缩，进度仍走 turn/* 通知</text>
<text x="560" y="778" text-anchor="start" font-size="10.5" fill="#ff8c00" font-family="JetBrains Mono, monospace" font-weight="700">thread/rollback</text>
<text x="680" y="778" text-anchor="start" font-size="10" fill="#7a7a85" font-family="Inter, sans-serif">丢弃末尾 N 轮并落回滚标记</text>
<line x1="80" y1="836" x2="116" y2="836" stroke="#a855f7" stroke-width="2"/>
<text x="124" y="840" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">客户端请求</text>
<line x1="230" y1="836" x2="266" y2="836" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="274" y="840" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">通知/响应</text>
<line x1="380" y1="836" x2="416" y2="836" stroke="#00ff88" stroke-width="1.5"/>
<text x="424" y="840" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">内部驱动</text>
<line x1="510" y1="836" x2="546" y2="836" stroke="#ff8c00" stroke-width="2"/>
<text x="554" y="840" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">沙箱执行</text>
<line x1="660" y1="836" x2="696" y2="836" stroke="#ff4466" stroke-width="2"/>
<text x="704" y="840" text-anchor="start" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">模型调用</text>
<text x="1164" y="840" text-anchor="end" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">默认组合：workspace-write + on-request</text>
</svg>