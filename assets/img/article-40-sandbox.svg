<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, sans-serif">
<defs>
<marker id="m-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00f0ff"/></marker>
<marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00ff88"/></marker>
<marker id="m-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8c00"/></marker>
<marker id="m-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
<marker id="m-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff4466"/></marker>
<marker id="m-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a85"/></marker>
</defs>
<rect width="1200" height="700" fill="#0a0a0f"/>
<text x="600" y="42" text-anchor="middle" font-size="22" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">沙箱 × 审批：Codex 的双闸门矩阵</text>
<text x="600" y="66" text-anchor="middle" font-size="13" fill="#7a7a85" font-family="Inter, sans-serif">沙箱定义技术边界，审批策略决定越过边界前要不要停下来问人</text>
<text x="480" y="100" text-anchor="middle" font-size="12.5" fill="#00f0ff" font-family="Inter, sans-serif" font-weight="700">sandbox_mode（技术边界 →）</text>
<rect x="310" y="112" width="150" height="56" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<text x="385" y="134" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">read-only</text>
<text x="385" y="156" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">只读</text>
<rect x="468" y="112" width="150" height="56" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<text x="543" y="134" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">workspace-write</text>
<text x="543" y="156" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">工作区可写</text>
<rect x="626" y="112" width="150" height="56" rx="8" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-width="1.5"/>
<text x="701" y="134" text-anchor="middle" font-size="10.5" fill="#00f0ff" font-family="JetBrains Mono, monospace" font-weight="700">danger-full-access</text>
<text x="701" y="156" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">无沙箱</text>
<text x="180" y="340" font-size="12.5" font-weight="700" fill="#00ff88" transform="rotate(-90 180 340)" text-anchor="middle" font-family="Inter, sans-serif">approval_policy（审批策略）</text>
<rect x="200" y="192" width="100" height="110" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<text x="250" y="234" text-anchor="middle" font-size="10.5" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">untrusted</text>
<text x="250" y="254" text-anchor="middle" font-size="9" fill="#7a7a85" font-family="Inter, sans-serif">不在信任集逐条问</text>
<rect x="200" y="314" width="100" height="110" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<text x="250" y="356" text-anchor="middle" font-size="10.5" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">on-request</text>
<text x="250" y="376" text-anchor="middle" font-size="9" fill="#7a7a85" font-family="Inter, sans-serif">默认 · 越界才问</text>
<rect x="200" y="436" width="100" height="110" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<text x="250" y="478" text-anchor="middle" font-size="10.5" fill="#00ff88" font-family="JetBrains Mono, monospace" font-weight="700">never</text>
<text x="250" y="498" text-anchor="middle" font-size="9" fill="#7a7a85" font-family="Inter, sans-serif">从不询问</text>
<rect x="310" y="192" width="150" height="110" rx="6" fill="#ff4466" fill-opacity="0.08" stroke="#ff4466" stroke-width="1.4"/>
<text x="385" y="226" text-anchor="middle" font-size="11.5" fill="#ff4466" font-family="Inter, sans-serif" font-weight="700">逐条确认</text>
<text x="385" y="252" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">连只读命令也要问</text>
<text x="385" y="270" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">几乎不可用</text>
<rect x="468" y="192" width="150" height="110" rx="6" fill="#ff8c00" fill-opacity="0.08" stroke="#ff8c00" stroke-width="1.4"/>
<text x="543" y="226" text-anchor="middle" font-size="11.5" fill="#ff8c00" font-family="Inter, sans-serif" font-weight="700">强审批工作区</text>
<text x="543" y="252" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">问答审查类任务</text>
<text x="543" y="270" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">偏保守的档位</text>
<rect x="626" y="192" width="150" height="110" rx="6" fill="#ff4466" fill-opacity="0.08" stroke="#ff4466" stroke-width="1.4"/>
<text x="701" y="226" text-anchor="middle" font-size="11.5" fill="#ff4466" font-family="Inter, sans-serif" font-weight="700">危险组合</text>
<text x="701" y="252" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">高权限却步步问</text>
<text x="701" y="270" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">不如收窄沙箱</text>
<rect x="310" y="314" width="150" height="110" rx="6" fill="#ff8c00" fill-opacity="0.08" stroke="#ff8c00" stroke-width="1.4"/>
<text x="385" y="348" text-anchor="middle" font-size="11.5" fill="#ff8c00" font-family="Inter, sans-serif" font-weight="700">exec 默认</text>
<text x="385" y="374" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">codex exec 的</text>
<text x="385" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">read-only 起点</text>
<rect x="468" y="314" width="150" height="110" rx="6" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="1.4"/>
<text x="543" y="348" text-anchor="middle" font-size="11.5" fill="#00ff88" font-family="Inter, sans-serif" font-weight="700">产品默认 ★</text>
<text x="543" y="374" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">低摩擦的本地开发</text>
<text x="543" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">推荐档位</text>
<rect x="626" y="314" width="150" height="110" rx="6" fill="#ff8c00" fill-opacity="0.08" stroke="#ff8c00" stroke-width="1.4"/>
<text x="701" y="348" text-anchor="middle" font-size="11.5" fill="#ff8c00" font-family="Inter, sans-serif" font-weight="700">高权限强审批</text>
<text x="701" y="374" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">需要系统级操作的</text>
<text x="701" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">受控场景</text>
<rect x="310" y="436" width="150" height="110" rx="6" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1.4"/>
<text x="385" y="470" text-anchor="middle" font-size="11.5" fill="#00f0ff" font-family="Inter, sans-serif" font-weight="700">只读自动跑</text>
<text x="385" y="496" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">不打扰的只读</text>
<text x="385" y="514" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">问答 / 摘要</text>
<rect x="468" y="436" width="150" height="110" rx="6" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="1.4"/>
<text x="543" y="470" text-anchor="middle" font-size="11.5" fill="#00ff88" font-family="Inter, sans-serif" font-weight="700">CI 自动化</text>
<text x="543" y="496" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">流水线无人值守</text>
<text x="543" y="514" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">边界即护栏</text>
<rect x="626" y="436" width="150" height="110" rx="6" fill="#ff4466" fill-opacity="0.08" stroke="#ff4466" stroke-width="1.4"/>
<text x="701" y="470" text-anchor="middle" font-size="11.5" fill="#ff4466" font-family="Inter, sans-serif" font-weight="700">完全信任</text>
<text x="701" y="496" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">仅限隔离环境</text>
<text x="701" y="514" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">（容器/专用 CI）</text>
<rect x="800" y="112" width="364" height="434" rx="12" fill="#12121a" fill-opacity="0.5" stroke="#2a2a35" stroke-width="1.2"/>
<text x="982" y="140" text-anchor="middle" font-size="13.5" fill="#e8e8ec" font-family="Inter, sans-serif" font-weight="700">三个补充闸门</text>
<rect x="820" y="152" width="324" height="118" rx="8" fill="#a855f7" fill-opacity="0.05" stroke="#a855f7" stroke-width="1.5"/>
<text x="982" y="176" text-anchor="middle" font-size="11.5" fill="#a855f7" font-family="Inter, sans-serif" font-weight="700">审批人 approvals_reviewer</text>
<text x="982" y="198" text-anchor="middle" font-size="10.5" fill="#e8e8ec" font-family="Inter, sans-serif">user：审批弹给人（默认）</text>
<text x="982" y="218" text-anchor="middle" font-size="10.5" fill="#e8e8ec" font-family="Inter, sans-serif">auto_review：交给 reviewer agent 预审</text>
<text x="982" y="242" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">自动预审不改变沙箱边界本身，</text>
<text x="982" y="258" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">沙箱内已允许的动作不额外审查</text>
<rect x="820" y="282" width="324" height="132" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-width="1.5"/>
<text x="982" y="306" text-anchor="middle" font-size="11.5" fill="#00ff88" font-family="Inter, sans-serif" font-weight="700">平台原生实现（非自研隔离）</text>
<text x="982" y="328" text-anchor="middle" font-size="10.5" fill="#e8e8ec" font-family="Inter, sans-serif">macOS：Seatbelt（开箱即用）</text>
<text x="982" y="348" text-anchor="middle" font-size="10.5" fill="#e8e8ec" font-family="Inter, sans-serif">Linux / WSL2：bubblewrap（bwrap）</text>
<text x="982" y="368" text-anchor="middle" font-size="10.5" fill="#e8e8ec" font-family="Inter, sans-serif">Windows：原生沙箱 / WSL2 走 Linux 实现</text>
<text x="982" y="392" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">沙箱管住的不只是内置工具：</text>
<text x="982" y="408" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">git、包管理器、测试命令同样继承边界</text>
<rect x="820" y="426" width="324" height="108" rx="8" fill="#ff8c00" fill-opacity="0.05" stroke="#ff8c00" stroke-width="1.5"/>
<text x="982" y="450" text-anchor="middle" font-size="11.5" fill="#ff8c00" font-family="Inter, sans-serif" font-weight="700">精细调节：不开天窗的豁免</text>
<text x="982" y="472" text-anchor="middle" font-size="10" fill="#e8e8ec" font-family="Inter, sans-serif">writable_roots：追加可写目录</text>
<text x="982" y="492" text-anchor="middle" font-size="10" fill="#e8e8ec" font-family="Inter, sans-serif">rules：按命令前缀 allow/prompt/forbid</text>
<text x="982" y="514" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">config.toml 固化默认组合</text>
<text x="982" y="528" text-anchor="middle" font-size="9.5" fill="#7a7a85" font-family="Inter, sans-serif">会话内 /permissions 热切换</text>
<text x="480" y="590" text-anchor="middle" font-size="11.5" fill="#00f0ff" font-family="Inter, sans-serif" font-weight="700">推荐默认 = workspace-write + on-request        完全放开 = danger-full-access + never（仅隔离环境）</text>
<text x="480" y="614" text-anchor="middle" font-size="11" fill="#7a7a85" font-family="Inter, sans-serif">沙箱减少审批疲劳：边界内的常规动作直接自主执行，越界动作才回到审批流</text>
<text x="600" y="658" text-anchor="middle" font-size="11.5" fill="#00ff88" font-family="Inter, sans-serif" font-weight="600">信任模型不是「相信 agent 的意图」，而是「相信它运行在被强制的边界内」</text>
</svg>