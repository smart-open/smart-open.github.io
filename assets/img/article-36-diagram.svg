<text x="638" y="864" font-size="9" fill="#7a7a85">RuntimeContext维护call_depth</text>
<text x="638" y="878" font-size="9" fill="#7a7a85">超过MAX_DEPTH(3)拒绝调用</text>
<text x="638" y="892" font-size="9" fill="#7a7a85">防止A-&gt;B-&gt;A无限递归</text>
