<text x="210" y="846" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">(子Agent &lt; 10个)</text>
<text x="68" y="866" font-size="10" fill="#7a7a85">全量能力目录注入Prompt</text>
<text x="68" y="882" font-size="10" fill="#7a7a85">LLM根据description匹配</text>
<text x="68" y="898" font-size="10" fill="#7a7a85">实现最简单</text>
