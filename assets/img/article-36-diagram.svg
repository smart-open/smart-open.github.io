<text x="638" y="950" font-size="9" fill="#7a7a85">callable_sub_agent_ids白名单</text>
<text x="638" y="964" font-size="9" fill="#7a7a85">主Agent只能调配置的子Agent</text>
<text x="638" y="978" font-size="9" fill="#7a7a85">不在列表中直接拒绝</text>
<rect x="620" y="996" width="530" height="74" rx="6" fill="rgba(168,85,247,0.05)" stroke="#a855f7" stroke-width="1.5"/>
