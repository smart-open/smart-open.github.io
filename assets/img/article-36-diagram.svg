<text x="634" y="1008" font-size="9" fill="#7a7a85">MAX_PARALLEL=5</text>
<text x="634" y="1022" font-size="9" fill="#7a7a85">Semaphore控制并行信号量</text>
<text x="634" y="1036" font-size="9" fill="#7a7a85">超限返回错误提示</text>
