<text x="210" y="946" font-size="10" fill="#7a7a85" font-family="JetBrains Mono, monospace">(子Agent &gt; 10个)</text>
<text x="68" y="966" font-size="10" fill="#7a7a85">query向量检索召回Top-N</text>
